[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitminder"
version = "0.1.0"
description = "Self-hostable personal AI project control center"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "sqlmodel>=0.0.22,<1",
  "typer>=0.12,<1",
  "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
include = ["orbitminder*"]
